name: my-first-workflow
# To get trigger on every push in this repository in any branch
on: 
  schedule:
    - cron: "*/5 * * * *"

jobs:
 job1:
   name: JOB1
   runs-on: ubuntu-latest
   steps:
   - name: Running single command in Job1
     run: echo "Hi, this is my first github workflow"
   - name: Checking OS Release for GitHub Hosted Runner
     run : cat /etc/os-release
   - name: Calling Sleep
     run: sleep 20 
     
 job2: 
   name: JOB2
   runs-on: ubuntu-latest
   steps:
     - name: Checking the hostname for Runner
       run: hostname
     - name: Running multiple commands
       run: 
        echo "Hi from Emmanuel Elouma"
        echo "Current time is `date`"
        sleep 20
 job3: 
    name: JOB3
    needs: job1
    runs-on: windows-latest
    steps:
        - name: Job with Dependency
          run: sleep 10
        - name: Checking Runner Info
          shell: pwsh
          run: get-computerinfo
   
 job4: 
    name: JOB4
    needs: [job1, job2, job3]
    runs-on: macos-latest
    steps:
        - name: Job with multiple dependencies
          run: sleep 10 
        - name: Checking Runner info
          run: sw_vers
